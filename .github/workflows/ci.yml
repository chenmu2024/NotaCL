name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run check
      - name: Check production audit script syntax
        run: node --check scripts/audit-production.mjs
      - run: npm run build
      - run: npm run audit
      - name: Build preview-host fail-closed output
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://notacl.pages.dev
      - name: Audit preview-host fail-closed output
        run: npm run audit
        env:
          PUBLIC_SITE_URL: https://notacl.pages.dev
      - name: Build production-like canonical output
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://notacl.example
      - name: Audit production-like canonical output
        run: npm run audit
        env:
          PUBLIC_SITE_URL: https://notacl.example
